<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Simoon Cafe</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Top Navbar -->
    <header class="admin-header">
        <div class="admin-header-top">
            <div class="container-fluid">
                <div class="d-flex justify-content-between align-items-center">
                    <div class="brand-center">
                        <h1 class="text-xl md:text-2xl font-bold">Simoon Admin</h1>
                    </div>
                    <div class="d-flex">
                        <button class="btn btn-outline-secondary me-2" type="button" id="previewBtn">
                            <i class="bi bi-eye"></i> Preview
                        </button>
                        <button class="btn btn-outline-secondary" type="button" id="logoutBtn">
                            <i class="bi bi-box-arrow-left"></i> Logout
                        </button>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Desktop Navigation -->
        <nav class="admin-nav">
            <div class="container-fluid">
                <div class="d-flex justify-content-center flex-wrap gap-6 md:gap-10 text-lg font-medium">
                    <button class="nav-link active" data-section="categories">Categories</button>
                    <button class="nav-link" data-section="orders">Orders</button>
                    <button class="nav-link" data-section="settings">Settings</button>
                </div>
            </div>
        </nav>
    </header>

    <main class="admin-main">
        <div class="container-fluid admin-container">
            <!-- Main Category Tabs -->
            <div class="management-card">
                <div class="card-header">
                    <i class="bi bi-tags"></i> Manage Categories & Products
                </div>
                <div class="card-body">
                    <!-- تغییر به چیدمان یک ستونه -->
                    <div class="single-column-layout">
                        <!-- ردیف اول: نوار دسته‌بندی‌های اصلی -->
                        <div class="ribbon-container">
                            <div class="ribbon-wrapper">
                                <div class="categories-ribbon scrollable" id="mainTabsRibbon">
                                    <!-- تب‌های اصلی به صورت داینامیک توسط جاوا اسکریپت اضافه می‌شوند -->
                                </div>
                                <div class="add-tab-item">
                                    <button class="add-tab-btn" id="addMainTabBtn">
                                        <i class="bi bi-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- ردیف دوم: نوار زیردسته‌ها -->
                        <div class="ribbon-container">
                            <div class="ribbon-wrapper">
                                <div class="sub-categories-ribbon scrollable" id="subTabsRibbon">
                                    <!-- تب‌های زیرمجموعه به صورت داینامیک توسط جاوا اسکریپت اضافه می‌شوند -->
                                </div>
                                <div class="add-tab-item">
                                    <button class="add-tab-btn" id="addSubTabBtn">
                                        <i class="bi bi-plus"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- ردیف سوم: محتوا (محصولات) -->
                        <div id="contentArea">
                            <!-- محتوای تب‌ها به صورت داینامیک نمایش داده می‌شود -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Navigation -->
    <div class="mobile-bottom-nav">
        <div class="mobile-bottom-nav-item active" data-section="categories">
            <i class="bi bi-tags"></i>
            <span>Categories</span>
        </div>
        <div class="mobile-bottom-nav-item" data-section="orders">
            <i class="bi bi-receipt"></i>
            <span>Orders</span>
        </div>
        <div class="mobile-bottom-nav-item" data-section="settings">
            <i class="bi bi-gear"></i>
            <span>Settings</span>
        </div>
    </div>

    <!-- Modal for Adding/Editing Category (Handles both Main and Sub) -->
    <div class="modal fade" id="categoryModal" tabindex="-1" aria-labelledby="categoryModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="categoryModalLabel">New Category</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="categoryForm">
                        <input type="hidden" id="categoryId">
                        <input type="hidden" id="categoryType">
                        
                        <!-- Common Name Field -->
                        <div class="mb-3">
                            <label for="categoryName" class="form-label">Name</label>
                            <input type="text" class="form-control" id="categoryName" required>
                        </div>

                        <!-- Fields ONLY for Main Category -->
                        <div id="mainCategoryFields">
                            <div class="mb-3">
                                <label for="categoryImage" class="form-label">Image URL</label>
                                <div class="input-group">
                                    <input type="url" class="form-control" id="categoryImage" placeholder="Enter image URL or upload">
                                    <input type="file" class="d-none" id="categoryImageUpload" accept="image/*">
                                    <button class="btn btn-outline-secondary" type="button" id="uploadImageBtn">
                                        <i class="bi bi-upload"></i> Upload
                                    </button>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="categoryDescription" class="form-label">Description</label>
                                <textarea class="form-control" id="categoryDescription" rows="3"></textarea>
                            </div>
                        </div>

                        <!-- Fields ONLY for Subcategory -->
                        <div class="mb-3" id="parentCategoryDiv" style="display: none;">
                            <label for="parentCategory" class="form-label">Parent Category</label>
                            <select id="parentCategory" class="form-select">
                                <option value="">Select main category...</option>
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="deleteCategoryBtn" style="display: none;">Delete</button>
                    <button type="button" class="btn btn-primary" id="saveCategoryBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal for Adding/Editing Product with Tabs -->
    <div class="modal fade" id="productModal" tabindex="-1" aria-labelledby="productModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-fullscreen-md-down">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="productModalLabel">New Product</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        
                        <!-- Product Tabs -->
                        <ul class="nav nav-tabs" id="productTab" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="basic-tab" data-bs-toggle="tab" data-bs-target="#basic" type="button" role="tab">Info</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="inventory-tab" data-bs-toggle="tab" data-bs-target="#inventory" type="button" role="tab">Inventory</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="seo-tab" data-bs-toggle="tab" data-bs-target="#seo" type="button" role="tab">Meta</button>
                            </li>
                        </ul>
                        
                        <div class="tab-content" id="productTabContent">
                            <!-- Tab 1: Basic Info -->
                            <div class="tab-pane fade show active" id="basic" role="tabpanel">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="name" class="form-label">Product Name</label>
                                        <input type="text" class="form-control" id="name" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="price" class="form-label">Price</label>
                                        <input type="number" class="form-control" id="price" required>
                                    </div>
                                </div>
                                
                                <!-- Image field styled like mainCategoryFields -->
                                <div class="mb-3">
                                    <label for="image" class="form-label">Product Image</label>
                                    <div class="input-group">
                                        <input type="url" class="form-control" id="image" placeholder="Enter image URL or upload">
                                        <input type="file" class="d-none" id="imageUpload" accept="image/*">
                                        <button class="btn btn-outline-secondary" type="button" id="productUploadImageBtn">
                                            <i class="bi bi-upload"></i> Upload
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <!-- Tab 2: Inventory -->
                            <div class="tab-pane fade" id="inventory" role="tabpanel">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="category" class="form-label">Main Category</label>
                                        <select id="category" class="form-select" required>
                                            <option value="">Select...</option>
                                        </select>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label for="sub_category" class="form-label">Subcategory</label>
                                        <select id="sub_category" class="form-select" required>
                                            <option value="">First select a main category</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label for="stock_quantity" class="form-label">Stock Quantity</label>
                                        <input type="number" class="form-control" id="stock_quantity" required>
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <div class="form-check mt-4">
                                            <input class="form-check-input" type="checkbox" id="is_special">
                                            <label class="form-check-label" for="is_special">
                                                Is a special product
                                            </label>
                                        </div>
                                    </div>
                                </div>
                                
                                <!-- Ingredients Section -->
                                <div class="mb-3">
                                    <label for="ingredients" class="form-label">Ingredients</label>
                                    <div id="ingredientsContainer">
                                        <!-- Ingredient rows will be added here -->
                                    </div>
                                    <button type="button" class="btn btn-sm btn-outline-secondary mt-2" id="addIngredientBtn">
                                        <i class="bi bi-plus"></i> Add Ingredient
                                    </button>
                                </div>
                            </div>
                            
                            <!-- Tab 3: SEO -->
                            <div class="tab-pane fade" id="seo" role="tabpanel">
                                <div class="mb-3">
                                    <label for="meta_title" class="form-label">Meta Title</label>
                                    <input type="text" class="form-control" id="meta_title">
                                </div>
                                <div class="mb-3">
                                    <label for="meta_description" class="form-label">Meta Description</label>
                                    <textarea class="form-control" id="meta_description" rows="3"></textarea>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="deleteProductBtn" style="display: none;">Delete</button>
                    <button type="button" class="btn btn-primary" id="saveProductBtn">Save Product</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div class="modal fade" id="confirmModal" tabindex="-1" aria-labelledby="confirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="confirmModalLabel">Confirm Action</h5>
                </div>
                <div class="modal-body">
                    <p id="confirmMessage">Are you sure you want to perform this action?</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" id="confirmCancelBtn">Cancel</button>
                    <button type="button" class="btn btn-danger" id="confirmOkBtn">Delete</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JS -->
    <!-- Note: You will need to update your JavaScript files to work with this new structure -->
    <!-- 1. پیکربندی و وضعیت -->
    <script src="js/config.js"></script>

    <!-- 2. تعریف عناصر DOM -->
    <script src="js/dom-elements.js"></script>

    <!-- 3. توابع مدیریت رویدادها -->
    <script src="js/event-handlers.js"></script>

    <!-- 4. توابع کمکی -->
    <script src="js/utility-functions.js"></script>

    <!-- 5. توابع مدیریتی (ترتیب این دو اهمیتی ندارد) -->
    <script src="js/category-management.js"></script>
    <script src="js/product-management.js"></script>
    <script src="js/auto-layout-logger.js"></script><!-- <--- این خط را اضافه کنید -->


    <!-- 6. نقطه شروع و اجرای برنامه -->
    <script src="js/app.js"></script>
</body>
</html>
